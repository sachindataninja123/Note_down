<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F38F4" />
      <stop offset="100%" stop-color="#341EB7" />
    </linearGradient>

    <!-- Subtle Top Glow -->
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Fully Rounded Background Circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring/Glow -->
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="url(#glow)" stroke-width="1.5" />

  <!-- TaskPulse Lightning Icon -->
  <path
    d="M34 14 L20 33.5 H31 L28 50 L44 28.5 H33 Z"
    fill="#FFFFFF"
    stroke="#FFFFFF"
    stroke-width="1"
    stroke-linejoin="round"
  />
</svg>
